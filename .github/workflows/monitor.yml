name: monitor

# Each run polls for ~5h45m, saves state.json, then starts the next run.
# The schedule is only a backup in case the chain breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch Tazkarti
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_KEYWORDS: ${{ vars.WATCH_KEYWORDS }}
          RUN_SECONDS: "20700"
        run: python main.py

      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update state"
            git pull --rebase
            git push
          fi

      # Only chain on success, so a crashing bot can't loop endlessly.
      - name: Start next run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${{ github.ref_name }}"
